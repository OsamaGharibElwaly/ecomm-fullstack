<div class="min-h-screen bg-[#F7F3EF] overflow-x-hidden">
  <!-- Topbar -->
  <!-- <div class="sticky top-0 z-10 bg-white/90 backdrop-blur-md border-b border-gray-100 h-14 flex items-center px-4 sm:px-6">
    <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
    <div class="flex-1 text-center">
      <div class="inline-block h-6 w-48 bg-gray-300 rounded mx-auto"></div>
    </div>
    <div class="h-10 w-10 bg-gray-300 rounded-full relative">
      <div class="absolute -top-1 -right-1 h-5 w-5 bg-gray-400 rounded-full"></div>
    </div>
  </div> -->

  <div class="mx-auto w-full max-w-[960px] px-4 pt-4 sm:px-6 sm:pt-6">
    <!-- Title -->
    <div class="mt-6 h-10 w-64 bg-gray-300 rounded-xl"></div>

    <!-- Item count pill -->
    <div class="mt-3 flex justify-center">
      <div class="h-8 w-40 bg-gray-300 rounded-full"></div>
    </div>

    <!-- Cart items -->
    <div class="mt-6 space-y-5">
      @for (_ of [1,2,3,4,5]; track $index) {
        <div class="bg-white rounded-2xl shadow-sm p-4 sm:p-5 flex gap-4 relative">
          <!-- Product image -->
          <div class="h-28 w-28 sm:h-32 sm:w-32 bg-gray-200 rounded-xl flex-shrink-0"></div>

          <!-- Info -->
          <div class="flex-1 space-y-3">
            <div class="h-6 w-3/4 bg-gray-300 rounded"></div>
            <div class="h-5 w-1/2 bg-gray-300 rounded"></div>
            <div class="h-8 w-32 bg-gray-300 rounded-xl"></div>
          </div>

          <!-- Remove icon -->
          <div class="absolute top-4 right-4 h-8 w-8 bg-gray-300 rounded-full"></div>

          <!-- Qty controls -->
          <div class="mt-4 flex items-center gap-4">
            <div class="h-10 w-10 bg-gray-300 rounded-full"></div>
            <div class="h-10 w-16 bg-gray-300 rounded text-center"></div>
            <div class="h-10 w-10 bg-gray-300 rounded-full"></div>
          </div>
        </div>
      }
    </div>

    <!-- Promo code -->
    <div class="mt-8 flex gap-3">
      <div class="flex-1 h-12 bg-gray-200 rounded-xl"></div>
      <div class="h-12 w-32 bg-gray-300 rounded-xl"></div>
    </div>

    <!-- Frequently bought together -->
    <div class="mt-10">
      <div class="h-8 w-64 bg-gray-300 rounded-xl"></div>
      <div class="mt-5 grid grid-cols-3 gap-4">
        @for (_ of [1,2,3]; track $index) {
          <div class="aspect-square bg-gray-200 rounded-2xl"></div>
        }
      </div>
    </div>

    <!-- Summary -->
    <div class="mt-10 bg-white rounded-2xl shadow-sm p-6 space-y-4">
      <div class="flex justify-between">
        <div class="h-6 w-32 bg-gray-300 rounded"></div>
        <div class="h-6 w-24 bg-gray-300 rounded"></div>
      </div>
      <div class="flex justify-between">
        <div class="h-6 w-32 bg-gray-300 rounded"></div>
        <div class="h-6 w-20 bg-gray-300 rounded"></div>
      </div>
      <div class="border-t border-gray-200 pt-4 flex justify-between">
        <div class="h-8 w-40 bg-gray-300 rounded"></div>
        <div class="h-8 w-32 bg-gray-300 rounded"></div>
      </div>
    </div>

    <!-- Checkout button -->
    <div class="mt-8 h-14 w-full bg-gray-300 rounded-2xl"></div>
  </div>

  <!-- Safe area spacer -->
  <div class="h-20"></div>
</div>
