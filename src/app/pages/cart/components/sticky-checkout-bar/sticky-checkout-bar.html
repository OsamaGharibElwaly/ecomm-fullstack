<div class="fixed inset-x-0 bottom-0 z-40">
  <div class="mx-auto w-full max-w-[960px] px-3 sm:px-6">
    <div class="rounded-t-3xl bg-white/80 backdrop-blur shadow-[0_-10px_30px_rgba(0,0,0,0.08)] p-3 sm:p-4">
      <button
        type="button"
        class="w-full rounded-3xl bg-[#FF7A00] text-white font-extrabold
               py-4 sm:py-5 text-base sm:text-lg
               flex items-center justify-center gap-3 hover:brightness-95 active:brightness-90"
        (click)="onCheckout()"
      >
        <span>Proceed to Checkout</span>
        <span class="text-xl">→</span>
      </button>

      <div class="mt-3 text-center text-xs sm:text-sm text-[#9CA3AF] font-extrabold tracking-widest">
        SECURE 256-BIT SSL ENCRYPTED PAYMENT
      </div>

      <div class="mt-2 text-center text-sm text-[#111827] font-extrabold">
        Total: ${{ total.toFixed(2) }}
      </div>
    </div>
  </div>

  <div class="h-[env(safe-area-inset-bottom)] bg-transparent"></div>
</div>
