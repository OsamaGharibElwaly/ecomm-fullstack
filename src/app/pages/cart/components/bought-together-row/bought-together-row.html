<div class="min-w-0 overflow-x-auto [-webkit-overflow-scrolling:touch]">
  <div class="flex gap-4 min-w-max pb-2">
    @for (p of items; track p.id) {
      <div class="w-[130px] sm:w-[150px]">
        <div class="h-[110px] sm:h-[120px] rounded-3xl overflow-hidden bg-white/70 shadow-sm">
          <img [src]="p.imageUrl" [alt]="p.title" class="h-full w-full object-cover" loading="lazy" />
        </div>

        <div class="mt-2">
          <div class="text-sm font-extrabold text-[#111827] leading-tight line-clamp-2">
            {{ p.title }}
          </div>
          <div class="mt-1 text-sm font-extrabold text-[#FF7A00]">
            ${{ p.price }}
          </div>
        </div>
      </div>
    }
  </div>
</div>
