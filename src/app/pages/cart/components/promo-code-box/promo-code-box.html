<div class="rounded-3xl border-2 border-dashed border-[#D1D5DB] bg-white/40 p-3 sm:p-4">
  <div class="flex items-center gap-3">
    <div class="flex-1 min-w-0 rounded-2xl bg-white/70 px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="text-xl">🏷️</span>
        <input
          class="w-full bg-transparent outline-none text-sm sm:text-base text-[#111827] placeholder-[#9CA3AF]"
          placeholder="Promo code"
          [value]="value"
          (input)="onInput(($any($event.target).value))"
        />
      </div>
    </div>

    <button
      type="button"
      class="rounded-2xl px-5 py-3 font-extrabold text-sm sm:text-base
             bg-[#FFE6D1] text-[#FF7A00] hover:brightness-95 active:brightness-90"
      (click)="onApply()"
    >
      {{ applied ? 'Applied' : 'Apply' }}
    </button>
  </div>
</div>
