<div class="flex gap-4 overflow-x-auto pb-2 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
  @for (p of items; track p.id) {
    <a [routerLink]="['/product', p.id]" class="shrink-0 w-[180px] sm:w-[200px] rounded-3xl bg-white shadow-sm p-3">
      <div class="rounded-2xl overflow-hidden bg-[#F3F4F6]">
        <img class="h-28 sm:h-32 w-full object-cover" [src]="p.imageUrl" [alt]="p.title" />
      </div>

      <div class="mt-3 font-extrabold text-[#111827] text-sm sm:text-base line-clamp-1">
        {{ p.title }}
      </div>
      <div class="mt-1 font-extrabold text-[#FF7A00]">
        {{ fmt(p.price) }}
      </div>
    </a>
  }
</div>
