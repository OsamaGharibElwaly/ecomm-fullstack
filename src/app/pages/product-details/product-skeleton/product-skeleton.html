<!-- product-skeleton.component.html -->
<div class="min-h-screen bg-[#F7F3EF] overflow-x-hidden animate-pulse">
  <!-- Top navigation bar -->
  <!-- <div class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm h-14 flex items-center px-4 sm:px-6">
    <div class="h-8 w-8 bg-gray-300 rounded-full"></div>
    <div class="flex-1 text-center">
      <div class="inline-block h-6 w-40 bg-gray-300 rounded"></div>
    </div>
    <div class="h-10 w-10 bg-gray-300 rounded-full relative">
      <div class="absolute -top-1 -right-1 h-5 w-5 bg-gray-400 rounded-full text-white text-xs flex items-center justify-center">
        5
      </div>
    </div>
  </div> -->

  <div class="mx-auto w-full max-w-[1200px] px-3 pt-3 sm:px-6 sm:pt-4 md:px-6">
    <div class="mt-4 grid grid-cols-1 gap-5 lg:grid-cols-2 lg:gap-8 lg:items-start">

      <!-- Hero image area -->
      <div class="min-w-0 lg:sticky lg:top-6">
        <div class="w-full overflow-hidden rounded-3xl bg-gray-200 aspect-[4/5] sm:aspect-[5/6] lg:aspect-square relative shadow-md">
          <!-- HOT badge -->
          <div class="absolute top-4 left-4 h-8 w-20 bg-gray-300 rounded-full"></div>
          <!-- Carousel dots at bottom -->
          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2.5">
            @for (_ of [1,2,3,4,5]; track $index) {
              <div class="h-3 w-3 rounded-full bg-gray-300"></div>
            }
          </div>
        </div>
      </div>

      <!-- Product info card -->
      <div class="min-w-0 rounded-3xl bg-white/80 backdrop-blur-lg p-5 sm:p-6 shadow-lg space-y-6">
        <!-- Title -->
        <div class="h-11 w-5/6 bg-gray-300 rounded-xl"></div>

        <!-- Heart icon -->
        <div class="flex justify-end">
          <div class="h-10 w-10 bg-gray-200 rounded-full"></div>
        </div>

        <!-- Price + old price -->
        <div class="flex items-baseline gap-4">
          <div class="h-12 w-40 bg-gray-300 rounded-xl"></div>
          <div class="h-7 w-28 bg-gray-300 rounded line-through"></div>
        </div>

        <!-- Rating -->
        <div class="flex items-center gap-3">
          <div class="flex gap-1">
            @for (_ of [1,2,3,4,5]; track $index) {
              <div class="h-6 w-6 bg-gray-300 rounded-full"></div>
            }
          </div>
          <div class="h-6 w-56 bg-gray-300 rounded"></div>
        </div>

        <!-- Short description -->
        <div class="space-y-2.5">
          <div class="h-5 w-full bg-gray-300 rounded"></div>
          <div class="h-5 w-full bg-gray-300 rounded"></div>
          <div class="h-5 w-5/6 bg-gray-300 rounded"></div>
          <div class="h-5 w-4/6 bg-gray-300 rounded"></div>
        </div>

        <!-- Color variants -->
        <div class="space-y-4">
          <div class="h-6 w-44 bg-gray-300 rounded"></div>
          <div class="flex gap-4">
            @for (_ of [1,2,3,4]; track $index) {
              <div class="h-12 w-12 rounded-full bg-gray-300"></div>
            }
          </div>
        </div>

        <!-- Quantity -->
        <div class="space-y-4">
          <div class="h-6 w-36 bg-gray-300 rounded"></div>
          <div class="flex items-center gap-6">
            <div class="h-12 w-12 bg-gray-300 rounded-xl"></div>
            <div class="h-12 w-24 bg-gray-300 rounded-xl text-center"></div>
            <div class="h-12 w-12 bg-gray-300 rounded-xl"></div>
          </div>
        </div>

        <!-- Tabs -->
        <div class="pt-8 border-t border-gray-200">
          <div class="flex gap-10 overflow-x-auto pb-2">
            @for (_ of [1,2,3]; track $index) {
              <div class="h-9 w-40 bg-gray-300 rounded flex-shrink-0"></div>
            }
          </div>
          <div class="h-1 w-40 bg-gray-300 rounded mt-2"></div>
        </div>

        <!-- Tab content placeholder -->
        <div class="pt-6 space-y-4">
          <div class="h-6 w-60 bg-gray-300 rounded"></div>
          <div class="space-y-3">
            <div class="h-5 w-full bg-gray-300 rounded"></div>
            <div class="h-5 w-full bg-gray-300 rounded"></div>
            <div class="h-5 w-5/6 bg-gray-300 rounded"></div>
          </div>
        </div>

        <!-- You May Also Like -->
        <div class="mt-12">
          <div class="h-10 w-80 bg-gray-300 rounded-xl mb-6"></div>
          <div class="min-w-0 overflow-x-auto">
            <div class="flex gap-5 min-w-max">
              @for (_ of [1,2,3,4]; track $index) {
                <div class="w-64 rounded-3xl bg-white shadow-sm p-3 overflow-hidden">
                  <div class="relative rounded-2xl bg-gray-200">
                    <div class="w-full h-40 bg-gray-200"></div>
                  </div>
                  <div class="mt-3 space-y-2">
                    <div class="h-5 w-5/6 bg-gray-300 rounded"></div>
                    <div class="h-4 w-3/5 bg-gray-300 rounded"></div>
                  </div>
                  <div class="mt-2 flex justify-between">
                    <div class="h-7 w-24 bg-gray-300 rounded"></div>
                    <div class="h-10 w-10 bg-gray-300 rounded-2xl"></div>
                  </div>
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom orange bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#FF7A00] h-16 shadow-2xl flex items-center px-4">
      <div class="h-12 w-full bg-gray-300/40 rounded-2xl"></div>
    </div>
  </div>
</div>
