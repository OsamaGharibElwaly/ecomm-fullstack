<div class="flex items-start justify-between gap-4">
  <div class="min-w-0">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-[#111827] leading-tight">
      {{ title }}
    </h1>

    <div class="mt-3 flex items-end gap-3">
      <div class="text-3xl sm:text-4xl font-extrabold text-[#FF7A00]">
        {{ format(price) }}
      </div>

      @if (oldPrice) {
        <div class="text-sm sm:text-base font-bold text-[#B9B9B9] line-through pb-1">
          {{ format(oldPrice) }}
        </div>
      }
    </div>
  </div>

  <button
    type="button"
    (click)="toggleLike.emit()"
    class="h-12 w-12 sm:h-14 sm:w-14 rounded-2xl bg-[#F7F3EF] grid place-items-center active:scale-95 transition"
    aria-label="favorite"
  >
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
      <path
        d="M12 21s-7-4.6-9.4-8.6C.7 9.1 2.2 6 5.6 6c1.9 0 3.2 1 4.1 2.2C10.6 7 12 6 13.9 6c3.4 0 4.9 3.1 3 6.4C19 16.4 12 21 12 21Z"
        [attr.fill]="liked ? '#FF7A00' : 'none'"
        stroke="#111827"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>

<div class="mt-4 flex items-center justify-between">
  <div class="text-sm sm:text-base text-[#111827] font-bold">
    <span class="text-[#F59E0B]">★★★★★</span>
  </div>

  <div class="text-sm sm:text-base text-[#111827] font-semibold">
    {{ rating }} ({{ reviewsCount }} reviews)
  </div>
</div>
