<div class="min-h-screen w-full bg-[#FFF3E8] flex items-center justify-center px-4">
  <div class="max-w-md w-full text-center">
    <!-- 404 Number -->
    <div class="mb-6">
      <h1 class="text-9xl font-extrabold text-[#FF7A00] leading-none">404</h1>
    </div>

    <!-- Error Message -->
    <div class="mb-8">
      <h2 class="text-3xl font-extrabold text-[#1E1E1E] mb-3">Page Not Found</h2>
      <p class="text-lg text-[#6B7280]">
        Oops! The page you're looking for doesn't exist or has been moved.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button
        type="button"
        (click)="goHome()"
        class="px-6 py-3 rounded-2xl bg-[#FF7A00] text-white font-bold shadow-md hover:bg-[#E66A00] active:scale-95 transition-all"
      >
        Go to Home
      </button>
      <button
        type="button"
        (click)="goBack()"
        class="px-6 py-3 rounded-2xl bg-white text-[#FF7A00] font-bold border-2 border-[#FF7A00] hover:bg-[#FFF3E8] active:scale-95 transition-all"
      >
        Go Back
      </button>
    </div>

    <!-- Additional Help -->
    <div class="mt-8 text-sm text-[#6B7280]">
      <p>Need help? <a routerLink="/" class="text-[#FF7A00] font-bold hover:underline">Contact Support</a></p>
    </div>
  </div>
</div>
