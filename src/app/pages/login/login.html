<div class="min-h-screen flex items-center justify-center bg-[#FFF3E8] py-8">
  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center text-[#1E1E1E] mb-6">Login</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="block text-sm font-semibold text-[#1E1E1E]">Email</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          placeholder="Enter your email"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FF7A00] focus:border-transparent"
        />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-red-500 text-sm mt-2">
          <small *ngIf="form.get('email')?.hasError('required')">Email is required</small>
          <small *ngIf="form.get('email')?.hasError('email')">Please enter a valid email</small>
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="block text-sm font-semibold text-[#1E1E1E]">Password</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          placeholder="Enter your password"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FF7A00] focus:border-transparent"
        />
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="text-red-500 text-sm mt-2">
          <small *ngIf="form.get('password')?.hasError('required')">Password is required</small>
          <small *ngIf="form.get('password')?.hasError('minlength')">Password must be at least 6 characters long</small>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="form.invalid || loading"
        class="w-full bg-[#FF7A00] text-white py-3 rounded-lg font-semibold transition duration-300 hover:bg-[#FF5700] disabled:opacity-50"
      >
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <!-- Forgot Password Link -->
      <div class="text-center mt-4">
        <a routerLink="/auth/forgot-password" class="text-sm text-[#FF7A00] hover:underline">Forgot Password?</a>
      </div>
    </form>
  </div>
</div>
