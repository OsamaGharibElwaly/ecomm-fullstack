<div class="animate-pulse">
  <div class="h-6 w-56 rounded-lg bg-[#E5E7EB]"></div>
  
  <div class="mt-4 sm:mt-5 grid grid-cols-3 gap-4">
    @for (i of [1,2,3]; track i) {
      <div class="space-y-3">
        <div class="aspect-square rounded-2xl bg-[#E5E7EB]"></div>
        <div class="h-4 w-3/4 rounded bg-[#E5E7EB]"></div>
        <div class="h-4 w-1/2 rounded bg-[#E5E7EB]"></div>
      </div>
    }
  </div>
</div>
