<div class="space-y-4 sm:space-y-6 animate-pulse">
  @for (i of [1,2,3,4,5]; track i) {
    <div class="rounded-3xl bg-white/70 backdrop-blur p-4 shadow-sm">
      <div class="flex gap-4">
        <!-- Image -->
        <div class="relative h-20 w-20 sm:h-24 sm:w-24 rounded-2xl bg-[#E5E7EB] shrink-0"></div>
        
        <!-- Content -->
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-3">
            <div class="flex-1 space-y-2">
              <div class="h-5 w-3/4 rounded-lg bg-[#E5E7EB]"></div>
              <div class="h-4 w-1/2 rounded-lg bg-[#E5E7EB]"></div>
              <div class="h-6 w-24 rounded-lg bg-[#E5E7EB] mt-2"></div>
            </div>
            <div class="h-8 w-8 rounded-full bg-[#E5E7EB]"></div>
          </div>
          
          <!-- Quantity Controls -->
          <div class="mt-3 flex items-center justify-end">
            <div class="h-10 w-28 rounded-xl bg-[#E5E7EB]"></div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
