<div class="w-full max-w-full rounded-3xl bg-white shadow-sm p-3 sm:p-4 overflow-hidden">
  <!-- Navigation -->
  <a [routerLink]="['/product', product.id]" class="block cursor-pointer">
    <div class="relative overflow-hidden rounded-2xl bg-[#F3F4F6]">
      <img
        class="block w-full max-w-full object-cover h-32 sm:h-36 lg:h-40"
        [src]="product.imageUrl || ('https://picsum.photos/seed/' + product.id + '/600/400')"
        [alt]="product.title"
        (error)="onImgError($event)"
      />

      @if (product.badge) {
        <span
          class="absolute left-2 top-2 rounded-full px-3 py-1 font-extrabold text-xs sm:text-sm"
          [class.bg-[#FF7A00]]="product.badge === 'NEW'"
          [class.text-white]="product.badge === 'NEW'"
          [class.bg-[#FFD400]]="product.badge === 'SALE'"
          [class.text-[#1E1E1E]]="product.badge === 'SALE'"
        >
          {{ product.badge }}
        </span>
      }

      <button
        type="button"
        (click)="$event.preventDefault(); $event.stopPropagation(); toggleLike.emit(product.id)"
        class="absolute right-2 top-2 grid place-items-center rounded-full bg-white/90 shadow active:scale-95 transition
               h-9 w-9 sm:h-10 sm:w-10"
        aria-label="Like"
      >
        <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 21s-7-4.6-9.4-8.6C.7 9.1 2.2 6 5.6 6c1.9 0 3.2 1 4.1 2.2C10.6 7 12 6 13.9 6c3.4 0 4.9 3.1 3 6.4C19 16.4 12 21 12 21Z"
            [attr.fill]="product.liked ? '#FF3B30' : 'none'"
            stroke="#111827"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <div class="mt-3 min-w-0">
      <div class="flex items-center gap-1.5 font-bold text-[#1E1E1E] text-xs sm:text-sm min-w-0">
        <app-rating-stars [rating]="product.rating" />
        <span class="truncate">{{ product.rating }}</span>
      </div>

      <div class="mt-1 font-extrabold text-[#1E1E1E] line-clamp-1 text-sm sm:text-base break-words">
        {{ product.title }}
      </div>

      <div class="font-semibold text-[#8B7A6B] line-clamp-1 text-xs sm:text-sm break-words">
        {{ product.category }}
      </div>
    </div>
  </a>

  <div class="mt-2 flex items-end justify-between gap-2 min-w-0">
    <div class="min-w-0">
      <div class="text-[#FF7A00] font-extrabold text-base sm:text-lg truncate">
        {{ formatPrice(product.price) }}
      </div>

      @if (product.oldPrice) {
        <div class="text-xs sm:text-sm font-bold text-[#B9B9B9] line-through truncate">
          {{ formatPrice(product.oldPrice) }}
        </div>
      }
    </div>

    <button
      type="button"
      (click)="$event.stopPropagation(); addToCart.emit(product.id)"
      class="shrink-0 grid place-items-center rounded-2xl bg-[#FF7A00] text-white shadow active:scale-95 transition
             h-11 w-11 sm:h-12 sm:w-12"
      aria-label="Add to cart"
    >
      <svg class="h-6 w-6 sm:h-7 sm:w-7" viewBox="0 0 24 24" fill="none">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>
