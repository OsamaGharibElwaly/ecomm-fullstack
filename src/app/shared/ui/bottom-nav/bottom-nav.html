<nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#FFF3E8]/95 backdrop-blur border-t border-[#E5E7EB]/50 md:hidden">
  <div class="mx-auto w-full max-w-[430px] px-6 py-3">
    <div class="flex items-center justify-between">
      <a routerLink="/" class="flex flex-col items-center gap-1 text-[#FF7A00]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" fill="currentColor"/>
        </svg>
        <span class="text-[11px] font-bold">Home</span>
      </a>

      <a routerLink="/cart" class="flex flex-col items-center gap-1 text-[#7C6A5A]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
          <path d="M6 7h15l-2 8H8L6 7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M6 7 5 3H2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="text-[11px] font-bold">Cart</span>
      </a>

      <a routerLink="/favorites" class="flex flex-col items-center gap-1 text-[#7C6A5A]">
        <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
          <path d="M12 21s-7-4.6-9.4-8.6C.7 9.1 2.2 6 5.6 6c1.9 0 3.2 1 4.1 2.2C10.6 7 12 6 13.9 6c3.4 0 4.9 3.1 3 6.4C19 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span class="text-[11px] font-bold">Saved</span>
      </a>

      @if (isLoggedIn()) {
        <a routerLink="/account" class="flex flex-col items-center gap-1 text-[#7C6A5A]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="2"/>
            <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="text-[11px] font-bold">Account</span>
        </a>
      } @else {
        <a routerLink="/auth/login" class="flex flex-col items-center gap-1 text-[#7C6A5A]">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" stroke="currentColor" stroke-width="2"/>
            <path d="M4 20a8 8 0 0 1 16 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="text-[11px] font-bold">Account</span>
        </a>
      }
    </div>
  </div>
</nav>
