<div class="flex gap-3 overflow-x-auto pb-2
            [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
  @for (c of items; track c.id) {
    <button (click)="setActive(c.id)" class="shrink-0 flex flex-col items-center gap-2">
      <div
        class="grid place-items-center shadow-sm transition
               rounded-2xl
               h-16 w-16
               sm:h-[72px] sm:w-[72px]
               lg:h-16 lg:w-16"
        [class.bg-white]="activeId !== c.id"
        [class.bg-[#FF7A00]]="activeId === c.id"
      >
        @switch (c.icon) {
  @case ('grid') {
    <svg class="h-7 w-7 sm:h-8 sm:w-8"
         [class.text-white]="activeId === c.id" [class.text-[#1E1E1E]]="activeId !== c.id"
         viewBox="0 0 24 24" fill="none">
      <path d="M4 4h7v7H4V4Z" fill="currentColor"/>
      <path d="M13 4h7v7h-7V4Z" fill="currentColor"/>
      <path d="M4 13h7v7H4v-7Z" fill="currentColor"/>
      <path d="M13 13h7v7h-7v-7Z" fill="currentColor"/>
    </svg>
  }

  @case ('monitor') {
    <svg class="h-7 w-7 sm:h-8 sm:w-8"
         [class.text-white]="activeId === c.id" [class.text-[#1E1E1E]]="activeId !== c.id"
         viewBox="0 0 24 24" fill="none">
      <path d="M4 5h16v10H4V5Z" stroke="currentColor" stroke-width="2"/>
      <path d="M8 19h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  }

  @case ('hanger') {
    <svg class="h-7 w-7 sm:h-8 sm:w-8"
         [class.text-white]="activeId === c.id" [class.text-[#1E1E1E]]="activeId !== c.id"
         viewBox="0 0 24 24" fill="none">
      <path d="M12 4a2 2 0 0 0-2 2c0 1 .6 1.7 1.4 2.2l.6.3v1l-7 4v2h14v-2l-7-4v-1l.6-.3C13.4 7.7 14 7 14 6a2 2 0 0 0-2-2Z" fill="currentColor"/>
    </svg>
  }

  @case ('sofa') {
    <svg class="h-7 w-7 sm:h-8 sm:w-8"
         [class.text-white]="activeId === c.id" [class.text-[#1E1E1E]]="activeId !== c.id"
         viewBox="0 0 24 24" fill="none">
      <path d="M5 12a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v5H5v-5Z" stroke="currentColor" stroke-width="2"/>
      <path d="M4 17v2m16-2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  }

  @case ('dumbbell') {
    <svg class="h-7 w-7 sm:h-8 sm:w-8"
         [class.text-white]="activeId === c.id" [class.text-[#1E1E1E]]="activeId !== c.id"
         viewBox="0 0 24 24" fill="none">
      <path d="M6 10v4m12-4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M8 9v6m8-6v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M10 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  }

  @default {
    <!-- Default case, in case none of the cases match -->
    <span>No icon available</span>
  }
}

      </div>

      <div class="font-bold text-[11px] sm:text-xs"
           [class.text-[#FF7A00]]="activeId === c.id"
           [class.text-[#7C6A5A]]="activeId !== c.id">
        {{ c.name }}
      </div>
    </button>
  }
</div>
