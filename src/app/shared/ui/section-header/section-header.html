<div class="flex items-center justify-between">
  <div class="font-extrabold text-[#1E1E1E]
              text-lg sm:text-xl lg:text-2xl">
    {{ title }}
  </div>

  @if (actionText && actionLink) {
    <a class="text-sm sm:text-base font-extrabold text-[#FF7A00]" [routerLink]="actionLink">
      {{ actionText }}
    </a>
  } @else if (icon === 'filter') {
    <button class="grid place-items-center rounded-2xl bg-white shadow-sm active:scale-95 transition
                   h-11 w-11 sm:h-12 sm:w-12"
            aria-label="Filter">
      <svg class="h-5 w-5 sm:h-6 sm:w-6 text-[#1E1E1E]" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  }
</div>
