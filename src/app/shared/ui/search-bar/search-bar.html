<div class="flex items-center gap-3 rounded-2xl bg-white shadow-sm
            h-14 px-4
            sm:h-16 sm:px-5
            lg:h-14">
  <svg class="text-[#9CA3AF] h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none">
    <path
      d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
      stroke="currentColor" stroke-width="2" stroke-linecap="round"
    />
  </svg>

  <input
    class="w-full bg-transparent outline-none text-[#1E1E1E]
           placeholder:text-[#B9B9B9]
           text-sm sm:text-base"
    type="search"
    [value]="value"
    (input)="valueChange.emit(($any($event.target)).value)"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder || 'Search for products'"
    autocomplete="off"
  />

  <!-- optional: filter button on >= md -->
  <button
    type="button"
    class="hidden md:grid place-items-center h-10 w-10 rounded-xl bg-[#FFF3E8] text-[#1E1E1E] active:scale-95 transition"
    aria-label="Filter"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none">
      <path d="M4 7h16M7 12h10M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>
