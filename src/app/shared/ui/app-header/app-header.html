<header class="sticky top-0 z-50 bg-[#FFF3E8]/95 backdrop-blur-lg border-b border-[#E5E7EB]/50 shadow-sm">
  <div class="mx-auto w-full max-w-[1440px] px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14 sm:h-16">
      
      <!-- Logo / Brand - Clickable to Home -->
      <a 
        routerLink="/" 
        class="flex items-center gap-2.5 sm:gap-3 group">
        <div class="relative flex h-9 w-9 sm:h-10 sm:w-10 items-center justify-center rounded-xl bg-gradient-to-br from-[#FF7A00] to-[#FF9933] shadow-md group-hover:shadow-lg transition-all duration-300 group-hover:scale-105">
          <svg class="h-5 w-5 sm:h-6 sm:w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-lg font-extrabold text-[#1E1E1E] group-hover:text-[#FF7A00] transition-colors">
            ShopHub
          </h1>
          <p class="text-[10px] text-[#6B7280] -mt-0.5">Your favorite store</p>
        </div>
      </a>

      <!-- Actions -->
      <div class="flex items-center gap-2">
        
        <!-- Favorites Button -->
        <a
          routerLink="./favorites"
          class="relative h-10 w-10 grid place-items-center rounded-xl hover:bg-[#F7F3EF] active:scale-95 transition group"
          aria-label="Favorites">
          <svg 
            class="h-6 w-6 text-[#FF7A00] transition-transform group-hover:scale-110" 
            [attr.fill]="favoriteCount > 0 ? 'currentColor' : 'none'"
            [attr.stroke]="favoriteCount > 0 ? 'none' : 'currentColor'"
            stroke-width="2"
            viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          @if (favoriteCount > 0) {
            <span class="absolute -top-1 -right-1 h-5 min-w-[1.25rem] px-1 rounded-full bg-[#FF7A00] text-white text-[10px] font-extrabold grid place-items-center shadow-lg animate-pulse">
              {{ favoriteCount }}
            </span>
          }
        </a>

        <!-- Cart Button -->
        <a
          routerLink="/cart"
          class="relative h-10 w-10 grid place-items-center rounded-xl hover:bg-[#F7F3EF] active:scale-95 transition group"
          aria-label="Cart">
          <svg class="h-6 w-6 text-[#111827] transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none">
            <path d="M6 7h15l-2 8H8L6 7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M6 7 5 3H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          @if (cartCount > 0) {
            <span class="absolute -top-1 -right-1 h-5 min-w-[1.25rem] px-1 rounded-full bg-[#111827] text-white text-[10px] font-extrabold grid place-items-center shadow-lg">
              {{ cartCount }}
            </span>
          }
        </a>

        <!-- Auth: Sign in / Sign up or Logout -->
        <app-auth-nav />

        <!-- Menu Button (Mobile) -->
        <button 
          class="sm:hidden h-10 w-10 grid place-items-center rounded-xl hover:bg-[#F7F3EF] active:scale-95 transition"
          aria-label="Menu">
          <svg class="h-6 w-6 text-[#111827]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

      </div>

    </div>
  </div>
</header>
