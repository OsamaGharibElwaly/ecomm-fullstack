<section class="relative overflow-hidden rounded-3xl bg-[#D9D9D9] shadow-sm">
  <img
    [ngSrc]="imageError ? IMAGE_FALLBACK_URL : imageUrl"
    [alt]="title || 'Promotional banner'"
    width="1200"
    height="700"
    priority
    [placeholder]="IMAGE_PLACEHOLDER_URL"
    (error)="onImgError()"
    class="w-full object-cover h-56 sm:h-64 md:h-72 lg:h-[360px] xl:h-[420px]"
  />

  <div class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/30 to-transparent"></div>

  <div class="absolute inset-0 p-5 sm:p-6 lg:p-8 flex flex-col justify-between">
    <div>
      <span class="inline-flex items-center rounded-xl bg-[#FFD400] px-3 py-1 text-xs sm:text-sm font-extrabold tracking-wide text-[#1E1E1E]">
        {{ badgeText }}
      </span>

      <div class="mt-3 text-white font-extrabold leading-[1.05]
                  text-[30px] sm:text-[34px] md:text-[38px] lg:text-[46px] xl:text-[52px]">
        {{ title }}
      </div>

      @if (subtitle) {
        <div class="mt-2 text-white/90
                    text-sm sm:text-base lg:text-lg max-w-[40ch]">
          {{ subtitle }}
        </div>
      }
    </div>

    <button
      type="button"
      [attr.aria-label]="ctaText + ' - ' + title"
      class="w-fit rounded-2xl bg-[#FF7A00] text-white font-extrabold shadow active:scale-95 transition inline-flex items-center gap-2
             px-6 py-3 sm:px-7 sm:py-3.5 lg:px-8 lg:py-4"
    >
      {{ ctaText }}
      <svg class="h-5 w-5 sm:h-6 sm:w-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="m13 6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</section>
