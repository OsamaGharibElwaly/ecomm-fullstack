<div class="border-b border-[#E5E7EB]">
  <div class="flex gap-6 overflow-x-auto [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    @for (t of tabs; track t.key) {
      <button
        type="button"
        (click)="setActive(t.key)"
        class="pb-3 text-sm sm:text-base font-extrabold whitespace-nowrap transition"
        [class.text-[#FF7A00]]="active === t.key"
        [class.text-[#6B7280]]="active !== t.key"
      >
        {{ t.label }}
        <div class="mt-3 h-[3px] rounded-full"
             [class.bg-[#FF7A00]]="active === t.key"
             [class.bg-transparent]]="active !== t.key"></div>
      </button>
    }
  </div>
</div>
