<div>
  <div class="text-xs font-extrabold tracking-widest text-[#6B7280]">{{ title }}</div>

  <div class="mt-3 flex items-center gap-3">
    @for (c of items; track c.id) {
      <button
        type="button"
        (click)="setActive(c.id)"
        class="h-10 w-10 rounded-full grid place-items-center active:scale-95 transition"
        [style.background]="c.hex"
        [class.ring-2]="activeId === c.id"
        [class.ring-[#111827]]="activeId === c.id"
        aria-label="color"
      >
        @if (activeId === c.id) {
          <span class="h-3 w-3 rounded-full bg-white/80"></span>
        }
      </button>
    }
  </div>
</div>
