<header
  class="flex items-center justify-between gap-2
         bg-white
         rounded-2xl
         shadow-sm
         px-3 sm:px-4
         py-3"
>
  <!-- Back -->
  <a
    [routerLink]="backLink"
    class="h-10 w-10 shrink-0 grid place-items-center
           rounded-xl
           hover:bg-[#F7F3EF]
           active:scale-95 transition"
    aria-label="Back"
  >
    <svg class="h-6 w-6 text-[#111827]" viewBox="0 0 24 24" fill="none">
      <path
        d="M15 18 9 12l6-6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </a>

  <!-- Title (centered) -->
  <div class="flex-1 min-w-0 font-extrabold text-[#111827] text-base sm:text-lg text-center truncate">
    {{ title }}
  </div>

  <!-- Auth + Cart -->
  <div class="flex items-center gap-1 sm:gap-2 shrink-0">
    <app-auth-nav />
    <a
      routerLink="/cart"
      class="relative h-10 w-10 grid place-items-center
             rounded-xl
             hover:bg-[#F7F3EF]
             active:scale-95 transition"
      aria-label="Cart"
    >
      <svg class="h-6 w-6 text-[#111827]" viewBox="0 0 24 24" fill="none">
        <path
          d="M6 7h15l-2 8H8L6 7Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
        />
        <path
          d="M6 7 5 3H2"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      @if (cartCount > 0) {
        <span
          class="absolute -top-1 -right-1
                 h-6 min-w-6 px-1
                 rounded-full
                 bg-[#FF7A00]
                 text-white
                 text-xs font-extrabold
                 grid place-items-center
                 shadow"
        >
          {{ cartCount }}
        </span>
      }
    </a>
  </div>
</header>
